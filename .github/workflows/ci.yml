name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo run --quiet -- dlq replay --help
      - run: bash -n scripts/test-durable-aggregate-input.sh
