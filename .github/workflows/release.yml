name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  broker:
    uses: ./.github/workflows/broker-durability.yml
  image:
    needs: [checks, broker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check matching artifact version
        run: |
          python3 - <<'PY'
          import os, tomllib, xml.etree.ElementTree as ET
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert tomllib.load(open('Cargo.toml', 'rb'))['package']['version'] == version
          assert ET.parse('clients/dotnet/Directory.Build.props').findtext('.//Version') == version
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/monatrox/distill
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
