services:
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q listeners | grep -q '5672'"]
      interval: 5s
      timeout: 5s
      retries: 12

  distill:
    build: .
    volumes:
      - distill_state:/var/lib/distill
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RUST_LOG: distill=info,tower_http=debug
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      DISTILL_INGEST_API_KEY: dev-key
      DISTILL_ADMIN_API_KEY: dev-key-admin
      DISTILL_BIND_ADDRESS: 0.0.0.0:8080
      DISTILL_ADMIN_BIND_ADDRESS: 127.0.0.1:8081
      DISTILL_REQUEST_BODY_LIMIT_BYTES: 2097152
      DISTILL_REQUEST_TIMEOUT_SECONDS: 30
      DISTILL_MAX_CONCURRENT_REQUESTS: 128
      DISTILL_MAX_REQUESTS_PER_MINUTE: 6000

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      - distill
    environment:
      DISTILL_PUBLIC_HOST: ${DISTILL_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  rabbitmq_data:
  distill_state:
  caddy_data:
  caddy_config:
