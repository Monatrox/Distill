[package]
name = "distill"
version = "0.1.0"
edition = "2024"
description = "A bounded Rust hot-path log aggregation service."
license = "MIT"
repository = "https://github.com/Monatrox/distill"
readme = "README.md"
keywords = ["logging", "aggregation", "rabbitmq", "postgresql"]
categories = ["web-programming", "database"]

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
literal_string_with_formatting_args = "allow"
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
lapin = { version = "2.5", default-features = false, features = ["rustls"] }
mimalloc = "0.1"
prost = "0.13"
prost-reflect = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[profile.bench]
debug = 1
